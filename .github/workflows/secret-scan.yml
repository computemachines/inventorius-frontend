name: Secret scan

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  current-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan current source without reopening rotated history
        run: >-
          docker run --rm
          -v "$PWD:/workspace"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source=/workspace --no-git --redact --exit-code=1
